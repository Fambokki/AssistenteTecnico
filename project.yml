name: AssistenteTecnico
options:
  bundleIdPrefix: it.personale
  developmentLanguage: it
  deploymentTarget:
    iOS: "16.0"
targets:
  AssistenteTecnico:
    type: application
    platform: iOS
    sources:
      - path: AssistenteTecnico
        excludes:
          - "Web/**"
      - path: AssistenteTecnico/Web
        type: folder
        buildPhase: resources
    info:
      path: AssistenteTecnico/Info.plist
      properties:
        CFBundleDisplayName: "Assistente"
        CFBundleDevelopmentRegion: it
        CFBundleLocalizations:
          - it
        CFBundleAllowMixedLocalizations: true
        CFBundleShortVersionString: "1.1"
        CFBundleVersion: "2"
        UILaunchScreen: {}
        UIStatusBarStyle: UIStatusBarStyleDefault
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        "UISupportedInterfaceOrientations~ipad":
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSCameraUsageDescription: "Per fotografare o filmare il guasto da analizzare."
        NSMicrophoneUsageDescription: "Per registrare l'audio dei video: rumori come ronzii e fischi aiutano la diagnosi."
        NSPhotoLibraryUsageDescription: "Per scegliere dalla libreria foto e video del guasto."
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: it.personale.assistentetecnico
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_ALTERNATE_APPICON_NAMES: "AppIcon-Notte AppIcon-Quadro AppIcon-Segnale AppIcon-Acqua AppIcon-Sicurezza"
        ASSETCATALOG_COMPILER_INCLUDE_ALL_APPICON_ASSETS: YES
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: NO
        SWIFT_VERSION: "5.0"
        DEVELOPMENT_LANGUAGE: it
